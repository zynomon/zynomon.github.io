<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aro</title>
<link id="favicon" rel="icon" type="image/svg+xml">
<style>
@font-face {
    font-family: 'Aro';
    src: url('./aro.ttf') format('truetype');
    font-display: swap;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Aro', monospace;
}
body {
    background: #000;
    color: #fff;
}
#error {
    display: none;
    color: red;
    padding: 50px;
    border: 2px solid red;
}
#content {
    display: none;
    padding: 20px;
}
h1 {
    font-size: 80px;
    pointer-events: none;
}
#glyphs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 5px;
    margin: 30px 0;
    border: 1px solid #333;
    padding: 10px;
}
.g {
    text-align: center;
    font-size: 24px;
    border: 1px solid #222;
    cursor: pointer;
}
.g:hover {
    background: #222;
}
#releases {
    margin: 30px 0;
    border: 1px solid #333;
    padding: 20px;
}
.tags {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.tag {
    padding: 5px 10px;
    border: 1px solid #444;
    cursor: pointer;
    background: #111;
}
.tag.active {
    background: #333;
    border-color: #666;
}
.assets {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.asset {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border: 1px solid #222;
    background: #0a0a0a;
}
.btn {
    padding: 5px 10px;
    background: #222;
    border: 1px solid #444;
    cursor: pointer;
    pointer-events: auto;
    text-decoration: none;
    color: #fff;
    display: inline-block;
}
.char {
    display: inline-block;
    transition: transform 0.2s;
}
</style>
</head>
<body>
<div id="error">ERROR: Aro font not loaded</div>
<div id="content">
<h1>Aro.</h1>
<div id="glyphs"></div>
<div id="releases">
<div class="tags" id="tags"></div>
<div class="assets" id="assets"></div>
</div>
</div>
<script type="module">
import { prepare, layout } from 'https://esm.sh/@chenglou/pretext';
const SVG_URL = 'https://raw.githubusercontent.com/zynomon/aro/main/src/en/U%2B0041_A.svg';
const API = 'https://api.github.com/repos/zynomon/aro/releases';
let releases = [];
let selected = null;
let mouseX = -1000;
let mouseY = -1000;
async function checkFont() {
try {
await document.fonts.load('16px "Aro"');
return true;
} catch(e) {
return false;
}
}
async function loadFavicon() {
try {
const r = await fetch(SVG_URL);
if (!r.ok) return;
let svg = await r.text();
svg = svg.replace('<svg', '<svg style="background:white"');
const blob = new Blob([svg], { type: 'image/svg+xml' });
const url = URL.createObjectURL(blob);
document.getElementById('favicon').href = url;
} catch(e) {}
}
async function getReleases() {
try {
const r = await fetch(API);
if (!r.ok) return;
releases = await r.json();
if (releases.length) selected = releases[0];
} catch(e) {}
}
function showGlyphs() {
const c = document.getElementById('glyphs');
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:\'",.<>?/~`';
for (let i = 0; i < chars.length; i++) {
const d = document.createElement('div');
d.className = 'g char';
d.textContent = chars[i];
c.appendChild(d);
}
}
function showTags() {
const c = document.getElementById('tags');
releases.forEach((rel, i) => {
const t = document.createElement('div');
t.className = 'tag char';
t.textContent = rel.tag_name;
t.onclick = () => selectRel(i);
c.appendChild(t);
});
showAssets();
}
function selectRel(i) {
selected = releases[i];
document.querySelectorAll('.tag').forEach((t, j) => t.classList.toggle('active', j === i));
showAssets();
}
function formatSize(bytes) {
if (bytes < 1024) return bytes + ' B';
if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
return (bytes / 1048576).toFixed(1) + ' MB';
}
function showAssets() {
const c = document.getElementById('assets');
c.innerHTML = '';
if (!selected || !selected.assets) return;
selected.assets.forEach(a => {
const d = document.createElement('div');
d.className = 'asset';
const nameSpan = document.createElement('span');
nameSpan.className = 'char';
nameSpan.textContent = a.name;
const metaSpan = document.createElement('span');
metaSpan.className = 'char';
metaSpan.textContent = a.download_count + ' | ' + formatSize(a.size) + ' ';
const btn = document.createElement('a');
btn.className = 'btn char';
btn.href = a.browser_download_url;
btn.target = '_blank';
btn.textContent = '\u2193';
metaSpan.appendChild(btn);
d.appendChild(nameSpan);
d.appendChild(metaSpan);
c.appendChild(d);
});
}
function initMouseRepel() {
document.addEventListener('mousemove', (e) => {
mouseX = e.clientX;
mouseY = e.clientY;
});
setInterval(() => {
const chars = document.querySelectorAll('.char');
chars.forEach(char => {
if (char.tagName === 'A') return;
const rect = char.getBoundingClientRect();
const cx = rect.left + rect.width / 2;
const cy = rect.top + rect.height / 2;
const dist = Math.sqrt(Math.pow(mouseX - cx, 2) + Math.pow(mouseY - cy, 2));
if (dist < 60) {
const angle = Math.atan2(cy - mouseY, cx - mouseX);
const force = (60 - dist) * 0.5;
const tx = Math.cos(angle) * force;
const ty = Math.sin(angle) * force;
char.style.transform = `translate(${tx}px, ${ty}px)`;
} else {
char.style.transform = 'translate(0, 0)';
}
});
}, 16);
}
async function init() {
const ok = await checkFont();
if (!ok) {
document.getElementById('error').style.display = 'block';
return;
}
await loadFavicon();
await getReleases();
document.getElementById('content').style.display = 'block';
showGlyphs();
showTags();
initMouseRepel();
}
init();
</script>
</body>
</html>
